name: Static and unit checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - run: npm run check
      - run: node --check installers/adopt.mjs && node --check installers/linux/config.mjs
      - run: bash -n installers/linux/install.sh && bash -n installers/linux/bootstrap.sh && bash -n installers/linux/renew-tls.sh
